[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "panoptes-recon"
version = "0.1.0"
description = "Passive-first, graph-native, temporally aware reconnaissance framework."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PANOPTES contributors" }]
keywords = ["reconnaissance", "bug-bounty", "security", "asset-discovery"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "aiofiles>=24.1.0",
  "duckdb>=1.1.0",
  "dnspython>=2.7.0",
  "httpx[http2]>=0.27.2",
  "jinja2>=3.1.4",
  "networkx>=3.4.2",
  "orjson>=3.10.11",
  "pluggy>=1.5.0",
  "pydantic>=2.9.2",
  "pydantic-settings[yaml]>=2.6.1",
  "rich>=13.9.4",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
  "textual>=0.86.1",
  "typer>=0.13.0",
  "uvloop>=0.21.0; platform_system != 'Windows'",
]

[project.scripts]
panoptes = "panoptes.__main__:main"

[dependency-groups]
dev = [
  "mypy>=1.13.0",
  "pre-commit>=4.0.1",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "respx>=0.21.1",
  "ruff>=0.7.2",
  "types-aiofiles>=24.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/panoptes"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["panoptes"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["aiofiles.*", "duckdb.*", "networkx.*", "orjson.*", "uvloop.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--cov=panoptes", "--cov-report=term-missing", "--cov-fail-under=85"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["panoptes"]
omit = ["src/panoptes/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
