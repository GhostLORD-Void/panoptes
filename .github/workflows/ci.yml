name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} / ${{ matrix.check }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        check: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }} --all-groups
      - name: Ruff lint
        if: matrix.check == 'lint'
        run: uv run --frozen --python ${{ matrix.python-version }} ruff check .
      - name: Ruff format check
        if: matrix.check == 'lint'
        run: uv run --frozen --python ${{ matrix.python-version }} ruff format --check .
      - name: Mypy strict
        if: matrix.check == 'typecheck'
        run: uv run --frozen --python ${{ matrix.python-version }} mypy --strict src/panoptes
      - name: Pytest with coverage
        if: matrix.check == 'test'
        run: uv run --frozen --python ${{ matrix.python-version }} pytest
